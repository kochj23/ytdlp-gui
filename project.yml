name: ytdlp-gui
options:
  bundleIdPrefix: com.jordankoch
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: "Automatic"
    INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Jordan Koch. All rights reserved."

targets:
  ytdlp-gui:
    type: application
    platform: macOS
    sources:
      - path: ytdlp-gui
        excludes:
          - "Resources/Binaries/**"
    resources:
      - path: ytdlp-gui/Resources/Assets.xcassets
      - path: ytdlp-gui/Resources/UserAgents.json
        optional: true
      - path: ytdlp-gui/Resources/Binaries
        optional: true
        buildPhase: resources
    info:
      path: ytdlp-gui/Info.plist
      properties:
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: com.jordankoch.ytdlp-gui
            CFBundleURLSchemes:
              - ytdlp-gui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordankoch.ytdlp-gui
        PRODUCT_NAME: "ytdlp-gui"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        CODE_SIGN_ENTITLEMENTS: "ytdlp-gui/ytdlp-gui.entitlements"
    entitlements:
      path: ytdlp-gui/ytdlp-gui.entitlements
      properties:
        com.apple.security.app-sandbox: false

  ytdlp-guiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ytdlp-guiTests
    dependencies:
      - target: ytdlp-gui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jordankoch.ytdlp-guiTests
        GENERATE_INFOPLIST_FILE: YES
